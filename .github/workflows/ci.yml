name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # Runs with no env vars on purpose — isSupabaseConfigured() and the
      # equivalent guards for email/payments/WhatsApp/Sentry all make the
      # app build and run without any of those connected. This step
      # verifies that stays true.
      - name: Build
        run: npm run build
